# .github/workflows/update-data.yml
# ==========================================
# OTOMATISASI SCREENER (GITHUB ACTIONS)
# ==========================================
# Tugas: Menjalankan screener.py setiap hari kerja 
# setelah bursa IDX tutup, lalu mengupdate data.json.
# ==========================================

name: Daily Stock Screener Update

on:
  # 1. Jadwal Otomatis (Cron Job)
  # '30 9 * * 1-5' = Jam 09:30 UTC (16:30 WIB), Senin - Jumat.
  # Pas setelah bursa IDX tutup (16:00 WIB).
  schedule:
    - cron: '30 9 * * 1-5'
    
  # 2. Trigger Manual (Tombol di tab Actions GitHub)
  # Berguna jika Anda ingin update data dadakan tanpa menunggu jadwal.
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Izin untuk commit & push file

    steps:
    # Langkah 1: Download kode dari repository Anda ke server GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # Langkah 2: Install Python di server
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Langkah 3: Install library yang dibutuhkan (yfinance, pandas, dll)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Langkah 4: Jalankan mesin screener!
    - name: Run Screener Engine
      run: |
        python py-engine/screener.py

    # Langkah 5: Simpan perubahan data.json kembali ke repository
    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data.json
        # Hanya commit jika ada perubahan data
        git diff --staged --quiet || git commit -m "chore: update data.json - $(date +'%Y-%m-%d %H:%M:%S')"
        git push
